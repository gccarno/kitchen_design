<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Design</title>
</head>
<body>
<script>
(function () {
  var url = window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl();
  // When served from the bundled assets the server url equals the local origin; only redirect elsewhere.
  if (url && url !== location.origin && url !== location.origin + '/') {
    location.replace(url);
  } else {
    location.replace('offline.html');
  }
})();
</script>
</body>
</html>
