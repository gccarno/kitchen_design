name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Render installs and builds with NODE_ENV=production, so npm ci skips devDependencies unless
  # told otherwise; the check job above installs everything and would never notice. Runs
  # render.yaml's own buildCommand, so the two can't drift apart.
  render-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Build as Render does
        env:
          NODE_ENV: production
        run: |
          cmd=$(sed -n 's/^ *buildCommand: //p' render.yaml | head -n 1)
          test -n "$cmd" || { echo "::error::no buildCommand in render.yaml"; exit 1; }
          echo "render.yaml buildCommand: $cmd"
          bash -euo pipefail -c "$cmd"
      - name: The build left package.json alone
        # Next installs missing TypeScript packages into package.json mid-build; on Render that
        # would mean the build only works by accident.
        run: git diff --exit-code -- package.json package-lock.json

  # The unit tests migrate an in-process PGlite; this applies the same migrations to a
  # real Postgres, twice (the second run must be a no-op), and fails if schema.ts has
  # changed without a generated migration.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations match schema.ts
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo "::error::schema.ts has changes with no migration. Run npm run db:generate and commit the result."
            exit 1
          fi
      - run: npm run db:migrate
      - name: A second run is a no-op
        run: npm run db:migrate

  # Playwright against `next dev` in disk mode (see playwright.config.ts); the LLM is
  # mocked in the browser, so no keys or database are needed.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
