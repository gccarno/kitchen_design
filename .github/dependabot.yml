version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Security fixes for npm packages (Next.js, sharp, …) arrive as PRs; version bumps are grouped weekly.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # react-konva tracks React's minor version, and the App Router runs the React bundled
      # with Next.js (19.2 in Next 15), not the one in package.json. Lift this with Next 16.
      - dependency-name: react-konva
        versions: [">=19.3.0"]
